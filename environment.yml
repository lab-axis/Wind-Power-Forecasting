# Create from the repository root (the relative path below is resolved from the current directory):
#   conda env create -f environment.yml
#   conda activate wind_power
#   python -m ipykernel install --user --name wind_power --display-name "Python (wind_power)"
name: wind_power
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
