# Frozen recipe before the new run; 2025 remains a development benchmark.
version: all-baselines-2026-10-05
seeds: [42, 2026, 3407]
horizons: [1, 3, 6, 9, 12, 24]
capacity_mwh: 21.0
lookback_hours: 24
crps_grid_points: 1001
selection_metric: crps
torch_threads: 4
batch_size: 128
emfn_epochs: 35
emfn_patience: 7
emfn_lr: 0.001
baseline_epochs: 25
baseline_patience: 5
baseline_lr: 0.001
cnn_lstm_lr: 0.002
transformer_epochs: 20
arima_orders: [[1, 0, 0], [2, 0, 1], [3, 0, 2], [1, 1, 0], [1, 1, 1]]
arima_maxiter: 150
lightgbm:
  quantile_levels: [0.01, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99]
  candidate_rounds: [100, 200]
  num_leaves: 15
  learning_rate: 0.05
  min_data_in_leaf: 40
  positive_quantile_floor_mwh: 0.000001
long_lightgbm:
  rounds: 500
  patience: 30
  num_leaves: 31
  learning_rate: 0.05
  missing_features: native_lightgbm_nan_handling
prophet:
  daily_seasonality: true
  weekly_seasonality: true
  yearly_seasonality: true
  changepoint_prior_scale: 0.05
  protocol: train_only_calendar_forecast_no_rolling_refit_no_future_weather
test_role: development_benchmark_previously_consulted
notes:
  - All trainable models are fit anew; no legacy checkpoint or prediction reuse.
  - ARIMA parameters fitted once per candidate and filtered causally at each issue time.
  - Prophet fitted once per seed; calendar-only target predictions shared across horizons.
  - Persistence and ARIMA deterministic results are not duplicated over seeds.
  - GRU final output is linear; clipping remains evaluator-only.
  - Long-feature LightGBM has up to 168h lags and calendar features, unlike 24h models.
