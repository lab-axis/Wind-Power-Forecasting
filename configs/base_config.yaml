project:
  name: "sangmyeong_wind_generation_forecasting"
  description: "인접 기상관측 정보와 시계열 모델을 활용한 상명풍력발전소 시간별 발전량(MWh) 예측"
  random_seed: 42

paths:
  raw_generation_file: "data/raw/generation/한국중부발전(주)_(AI 친화 데이터)풍력 발전 실적(상명풍력)_20260330.csv"
  raw_weather_saebyeol_info: "data/raw/weather/saebyeol_883/제주_관측환경정보_제주북부중산간_새별오름_883.xlsx"
  raw_weather_saebyeol_dir: "data/raw/weather/saebyeol_883"
  raw_weather_geumak_dir: "data/raw/weather/jeju_geumak_993"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  models_dir: "models/checkpoints"
  reports_dir: "reports"

plant_specs:
  plant_name: "상명풍력발전소"
  location: "제주특별자치도 제주시 한림읍 상명리"
  capacity_mw: 21.0  # 3.0 MW x 7기
  turbine_count: 7
  max_hourly_mwh: 21.0
  target_col: "generation_mwh"
  raw_col: "raw_generation"
  time_col: "datetime"
  interval_hours: 1

weather_stations:
  primary:
    id: 883
    name: "새별오름"
    address: "제주시 애월읍 봉성리 4554-22"
    latitude: "33° 21' 44\""
    longitude: "126° 21' 35\""
    elevation_m: 435.0
    approx_distance_km: 6.5
    start_date: "2017-10-30"
    elements: ["기온", "풍향", "풍속", "강수량", "강수유무", "기압", "습도", "적설"]
  secondary:
    id: 993
    name: "제주금악"
    status: "reserved_for_spatial_validation"
    approx_distance_km: 1.5
    start_date: "2024-04-06"
    use_in_initial_phase: false

# 시계열 분할: 발전량은 완전 관측, 기상 결측 및 입력 가용성은 별도 관리.
data_splits:
  study_period:
    start: "2023-01-01 01:00:00"
    end: "2025-12-31 23:00:00"
    total_hours: 26303
    missing_hours: 0  # generation only
  train:
    start: "2023-01-01 01:00:00"
    end: "2024-06-30 23:00:00"
    hours: 13127
    ratio_pct: 49.9
  validation:
    start: "2024-07-01 00:00:00"
    end: "2024-12-31 23:00:00"
    hours: 4416
    ratio_pct: 16.8
  test:
    start: "2025-01-01 00:00:00"
    end: "2025-12-31 23:00:00"
    hours: 8760
    ratio_pct: 33.3

modeling:
  lookback_hours: 24
  forecast_horizons:
    h1: 1
    h3: 3
    h6: 6
    h9: 9
    h12: 12
    h24: 24

feature_sets:
  m1_generation_only:
    target: "generation_mwh"
    features: ["generation_mwh"]
  m2_generation_wind:
    target: "generation_mwh"
    features: ["generation_mwh", "wind_speed", "wind_dir_sin", "wind_dir_cos"]
  m3_full_weather:
    target: "generation_mwh"
    features:
      - "generation_mwh"
      - "wind_speed"
      - "wind_dir_sin"
      - "wind_dir_cos"
      - "temperature"
      - "humidity"
      - "pressure"
  m4_full_with_rain:
    target: "generation_mwh"
    features:
      - "generation_mwh"
      - "wind_speed"
      - "wind_dir_sin"
      - "wind_dir_cos"
      - "temperature"
      - "humidity"
      - "pressure"
      - "precipitation"

# Forward-looking research decision; not retroactive metadata for completed runs.
# Current paper comparison: configs/multiseed_crps.yaml and run_multiseed_crps.
# Historical corrected benchmark/ablation entry points retain their loss selection.
evaluation_plan:
  status: implemented_in_paper_six_model_multiseed_comparison
  experiment_config: configs/multiseed_crps.yaml
  presentation_config: configs/paper_presentation.yaml  # Display groups, not training scope.
  primary_metric: crps
  primary_direction: minimize
  key_secondary_metric: zero_brier
  key_secondary_direction: minimize
  proposed_main_table: [crps, zero_brier, rmse, mae, zero_auprc]
  probabilistic_rmse_forecast: predictive_mean
  probabilistic_mae_forecast: predictive_median
  deterministic_point_metrics: native_point_forecast_clipped
  zero_probability_unavailable: report_not_applicable
  decision_context: after_reviewing_2025_development_benchmark

evaluation_metrics:
  absolute_errors:
    - "mae"        # Mean Absolute Error (MWh)
    - "rmse"       # Root Mean Squared Error (MWh)
    - "mse"        # Mean Squared Error (MWh^2)
  normalized_errors:
    - "nmae_pct"   # Normalized MAE (% of 21.0 MW rated capacity)
    - "nrmse_pct"  # Normalized RMSE (% of 21.0 MW rated capacity)
  relative_errors:
    - "rse"        # Relative Squared Error (Standard benchmark for Informer/PatchTST)
    - "rrse"       # Root Relative Squared Error
    - "rae"        # Relative Absolute Error
  percentage_and_market:
    - "wape_pct"   # Weighted Absolute Percentage Error (%)
    - "smape_pct"  # Symmetric MAPE (%)
  fit_and_correlation:
    - "r2"         # Coefficient of Determination
    - "corr"       # Pearson Correlation Coefficient (r)
  bias_and_inequality:
    - "mbe"        # Mean Bias Error (Over/Under-forecast diagnosis)
    - "tic"        # Theil's Inequality Coefficient (Theil's U)

# Corrected v3 protocol. These are fixed run settings, not selected on 2025 scores.
protocol:
  version: corrected-v3-2026-10-04
  test_role: development_benchmark_previously_consulted
  issue_time: latest_input_hour_end
  observation_latency_hours: 0  # Offline assumption; actual availability is unverified.
  max_ffill_hours: 3  # Fixed conservative policy; not an empirically optimal duration.
  zero_definition: exact_observed_zero_mwh
  incomplete_input_windows: exclude_without_compressing_time
  common_evaluation: intersection_of_target_timestamps_per_horizon
  crps_grid_points: 1001
  seeds: [42]
  train_epochs_emfn: 35
  train_epochs_baseline: 25
  train_epochs_transformer: 20
  batch_size: 128
  torch_threads: 4
  cudnn_deterministic: false  # Seeded, but not bitwise deterministic on CUDA.
  cudnn_benchmark: false
  allow_tf32: false
  point_metrics: clipped_to_physical_bounds
  bounds_metrics: raw_unclipped_predictions
  probabilistic_comparison: deterministic_baselines_are_dirac_distributions
